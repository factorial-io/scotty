on:
    workflow_dispatch:
    schedule:
        - cron: "5 * * * *" # every hour

jobs:
    clean:
        runs-on: ubuntu-latest
        name: Delete old test images
        steps:
            - name: Cleanup registry
              uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1
              with:
                  dry-run: false
                  delete-tags: "*"
                  delete-untagged: true
                  exclude-tags: main,next,v*
                  token: ${{ secrets.GITHUB_TOKEN }}
