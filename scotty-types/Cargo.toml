[package]
name = "scotty-types"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Minimal types-only crate for TypeScript generation"

# Note: This crate is part of the parent workspace

[features]
default = []

[dependencies]
# Only the minimal dependencies needed for type generation
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
jiff.workspace = true
uuid = { version = "1.8", default-features = false, features = ["v4", "serde"] }
ts-rs = { version = "12.0", default-features = false, features = ["uuid-impl"] }
base64.workspace = true
utoipa = { version = "6.0", default-features = true, features = ["uuid"] }

[dev-dependencies]
serde_json = "1.0"
