[tools]
node = "26"

[tasks.traefik]
description = "Start the local Traefik load balancer"
dir = "apps/traefik"
run = [
  "docker network inspect proxy >/dev/null 2>&1 || docker network create proxy",
  "docker compose up -d",
]

[tasks.dev]
description = "Run the scotty server in dev mode (no auth)"
depends = ["traefik"]
# Dev mode skips authentication, not authorization: run as the admin from
# config/casbin/policy.yaml.example so all blueprints and actions are allowed.
env = { SCOTTY__API__AUTH_MODE = "dev", SCOTTY__API__DEV_USER_EMAIL = "admin@example.com" }
run = "cargo run --bin scotty"

[tasks."dev:op"]
description = "Run the scotty server in oauth mode with secrets from 1Password (.env.1password)"
depends = ["traefik"]
env = { SCOTTY__API__AUTH_MODE = "oauth" }
run = "op run --env-file .env.1password -- cargo run --bin scotty"

[tasks.test]
description = "Run the Rust test suite (as in CI)"
run = "cargo test --all-targets"
